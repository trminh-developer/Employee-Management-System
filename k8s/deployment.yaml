apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmnexora-web
  namespace: tmnexora
  labels:
    app.kubernetes.io/name: tmnexora
    app.kubernetes.io/component: web
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tmnexora
      component: web
  template:
    metadata:
      labels:
        app: tmnexora
        component: web
    spec:
      # Run container as dedicated non-root user
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: tmnexora:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: tmnexora-config
            - secretRef:
                name: tmnexora-secret
          # Startup probe allows Django/Gunicorn up to 60s to boot
          startupProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          # Liveness probe monitors web server responsiveness
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness probe verifies database connectivity before traffic routing
          readinessProbe:
            httpGet:
              path: /readyz/
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
