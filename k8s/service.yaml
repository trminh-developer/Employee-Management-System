apiVersion: v1
kind: Service
metadata:
  name: tmnexora-service
  namespace: tmnexora
  labels:
    app.kubernetes.io/name: tmnexora
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app: tmnexora
    component: web
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
